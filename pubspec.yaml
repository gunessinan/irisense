name: irisense
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.5
  cupertino_icons: ^1.0.8
  hexcolor: ^3.0.2
  permission_handler: ^12.0.1
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.0
  google_fonts: ^7.0.0
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.5.1
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  http: ^1.6.0
  dio: ^5.9.2
  path_provider: ^2.1.5
  flutter_gemma: ^0.12.5

  firebase_core: ^4.5.0
  cloud_firestore: ^6.0.0
  crypto: ^3.0.3
  flutter_contacts: ^1.1.9+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true 

  assets:
    - .env
    - assets/words/
    - assets/images/
    - assets/quick-images/
    - assets/sounds/beep_short.ogg

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700